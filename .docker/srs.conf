# Local SRS lab for iPhoneMirror media-output verification.
# All endpoints bind to loopback through Docker port publishing. Do not use
# this configuration as an internet-facing streaming service.

listen              1935;

max_connections 1000;
srs_log_tank console;
daemon off;

http_api {
    enabled on;
    listen 1985;
    crossdomain on;
    auth {
        enabled         on;
        username        admin;
        password        admin;
    }
}

http_server {
    enabled on;
    listen 8080;
    dir ./objs/nginx/html;
}

srt_server {
    enabled on;
    listen 10080;
    maxbw 1000000000;
    connect_timeout 4000;
    peerlatency 300; # RTT * 3
    recvlatency 300; # RTT * 3
    latency 300; # RTT * 3
    tlpktdrop on;
    tsbpdmode on;
    sendbuf 2000000;
    recvbuf 2000000;
}

rtc_server {
    enabled on;
    listen 8000;
    tcp {
        enabled on;
        listen 8000;
    }
    protocol all;
    candidate *;
}

vhost __defaultVhost__ {
    min_latency on;

    play {
        gop_cache off;
        queue_length 3;
        mw_latency 0;
    }

    publish {
        mr off;
        mr_latency 0;
    }

    srt {
        enabled on;
        srt_to_rtmp on;
    }

    hls {
        enabled on;
    }

    http_remux {
        enabled on;
        mount [vhost]/[app]/[stream].flv;
    }

    rtc {
        enabled on;
        rtmp_to_rtc on;
        rtc_to_rtmp on;
    }

    http_hooks {
        enabled         on;
        on_publish      http://srs-auth:8080/api/v1/streams;
        on_unpublish    http://srs-auth:8080/api/v1/streams;
        on_play         http://srs-auth:8080/api/v1/sessions;
        on_stop         http://srs-auth:8080/api/v1/sessions;
        # on_dvr         http://127.0.0.1:8080/api/v1/play;
        # on_hls         http://127.0.0.1:8080/api/v1/play;
    }
}