[package]
name = "srs-auth"
version = "0.1.0"
authors = ["Ocyss <68412205+Ocyss@users.noreply.github.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dioxus = { version = "0.8.0-alpha.1", features = ["router", "fullstack"] }
tracing = "0.1.44"

axum = { version = "0.8.9", optional = true }
chrono = { version = "0.4.45", features = ["serde"] }
serde = "1.0.229"
serde_json = "1.0.151"
anyhow = "1.0.104"
native_db = { path = "./vendor/native_db", optional = true, features = [
    "tokio",
] }
native_model = { version = "0.6.2", optional = true }
once_cell = { version = "1.21.4", optional = true }
argon2 = { version = "0.6", optional = true }
hex = { version = "0.4.3", optional = true }
jsonwebtoken = { version = "11", optional = true, features = ["aws_lc_rs"] }
rand = { version = "0.10", optional = true }
reqwest = { version = "0.13", features = ["json"], optional = true }
nanoid = { version = "0.5.0", optional = true }
dotenvy = { version = "0.15.7", optional = true }
urlencoding = "2.1"
gloo-timers = { version = "0.4.0", features = ["futures"] }

[features]
default = ["web"]
# The feature that are only required for the web = ["dioxus/web"] build target should be optional and only enabled in the web = ["dioxus/web"] feature
web = ["dioxus/web"]
# The feature that are only required for the desktop = ["dioxus/desktop"] build target should be optional and only enabled in the desktop = ["dioxus/desktop"] feature
desktop = ["dioxus/desktop"]
# The feature that are only required for the mobile = ["dioxus/mobile"] build target should be optional and only enabled in the mobile = ["dioxus/mobile"] feature
mobile = ["dioxus/mobile"]
# The feature that are only required for the server = ["dioxus/server"] build target should be optional and only enabled in the server = ["dioxus/server"] feature
server = [
    "dioxus/server",
    "dep:axum",
    "dep:native_db",
    "dep:native_model",
    "dep:once_cell",
    "dep:argon2",
    "dep:hex",
    "dep:jsonwebtoken",
    "dep:rand",
    "dep:reqwest",
    "dep:nanoid",
    "dep:dotenvy",
]
